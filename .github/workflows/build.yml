name: Build

# Builds the Windows and Linux apps. Pushing a tag like v1.2.0 also publishes them to that GitHub release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to upload the builds to (leave empty to only build)'
        required: false

permissions:
  contents: write

env:
  PYINSTALLER_VERSION: '6.22.3'

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyinstaller==${{ env.PYINSTALLER_VERSION }}
      - run: python make_icon.py
      - run: pyinstaller --onefile --windowed --clean --noconfirm --name 2ship-to-pj64 --icon moon.ico --add-data "moon.png;." gui.py
      - name: Check the conversion code loads
        run: python -c "import convert; print(convert.OUT_NAME)"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/2ship-to-pj64.exe

  linux:
    # Built on an older glibc so the binary also runs on older distros.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Python with Tk
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk python3-venv xvfb
      - name: Install PyInstaller
        run: |
          python3 -m venv venv
          venv/bin/pip install pyinstaller==${{ env.PYINSTALLER_VERSION }}
      - run: venv/bin/python make_icon.py
      - run: venv/bin/pyinstaller --onefile --windowed --clean --noconfirm --name 2ship-to-pj64 --add-data "moon.png:." gui.py
      - name: Smoke test (window opens and keeps running)
        run: |
          set +e
          xvfb-run -a timeout 8 dist/2ship-to-pj64
          code=$?
          echo "exit code $code"
          test $code -eq 124
      - name: Package
        run: |
          mkdir out
          cp dist/2ship-to-pj64 out/2ship-to-pj64-linux-x86_64
          chmod +x out/2ship-to-pj64-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: out/2ship-to-pj64-linux-x86_64

  release:
    needs: [windows, linux]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
        run: |
          chmod +x assets/2ship-to-pj64-linux-x86_64
          if ! gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber assets/2ship-to-pj64.exe assets/2ship-to-pj64-linux-x86_64
